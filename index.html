<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1日28時間 ～在宅介護～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== CSS Variables / Color Scheme ===== */
:root {
  --bg: #faf6f0;
  --bg-card: #ffffff;
  --bg-warm: #fff8f0;
  --text: #3a3535;
  --text-light: #7a7070;
  --text-muted: #a89a8f;
  --accent: #c47a5a;
  --accent-light: #e8a889;
  --accent-dark: #9e5a3e;
  --green: #6a9e6b;
  --green-light: #e8f5e8;
  --red: #c45a5a;
  --red-light: #fde8e8;
  --blue: #5a7ac4;
  --blue-light: #e8f0fd;
  --yellow: #c4a45a;
  --yellow-light: #fdf5e0;
  --border: #e0d6cc;
  --shadow: rgba(80, 60, 40, 0.08);
  --shadow-md: rgba(80, 60, 40, 0.12);
  --radius: 12px;
  --font-serif: 'Noto Serif JP', serif;
  --font-sans: 'Zen Maru Gothic', sans-serif;
}

/* ===== Reset & Base ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
}

/* ===== Container ===== */
#game-container {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px;
  min-height: 100dvh;
}

/* ===== Screen System ===== */
.screen {
  display: none;
}
.screen.active {
  display: block;
}

/* ===== Card Base ===== */
.card {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: 0 2px 8px var(--shadow);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.2s ease;
  user-select: none;
  -webkit-user-select: none;
}

.card:active {
  transform: scale(0.97);
}

.card.selected {
  border-color: var(--accent);
  box-shadow: 0 2px 12px var(--shadow-md), 0 0 0 2px var(--accent-light);
}

.card.disabled {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
}

.card.completed {
  opacity: 0.6;
  background: #f0ede8;
  position: relative;
}

.card.completed::after {
  content: '✅ 設置済み';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-12deg);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--green);
  background: rgba(255,255,255,0.85);
  padding: 4px 12px;
  border-radius: 6px;
  border: 2px solid var(--green);
}

.card.joy {
  background: var(--yellow-light);
  border-color: var(--yellow);
}

.card.env {
  background: var(--blue-light);
  border-color: var(--blue);
}

/* ===== Typography ===== */
h1 {
  font-family: var(--font-serif);
  font-weight: 700;
}

h2, h3 {
  font-family: var(--font-serif);
  font-weight: 700;
}

/* ===== Title Screen ===== */
.title-header {
  text-align: center;
  padding: 48px 0 24px;
}

.title-main {
  font-size: 2.2rem;
  letter-spacing: 0.1em;
  color: var(--accent-dark);
  margin-bottom: 8px;
}

.title-sub {
  font-size: 0.95rem;
  color: var(--text-light);
  font-family: var(--font-sans);
  font-weight: 400;
}

.premise-panel {
  background: var(--bg-warm);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 20px;
  margin: 24px 0 32px;
  line-height: 2;
  font-size: 0.95rem;
}

.premise-panel p {
  margin-bottom: 12px;
}

.premise-panel p:last-child {
  margin-bottom: 0;
}

.premise-emphasis {
  font-weight: 700;
  color: var(--accent-dark);
}

/* ===== Buttons ===== */
.btn {
  display: block;
  width: 100%;
  padding: 16px 24px;
  font-family: var(--font-sans);
  font-size: 1.1rem;
  font-weight: 700;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: transform 0.1s ease, background 0.15s ease;
}

.btn:active {
  transform: scale(0.97);
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-primary:hover {
  background: var(--accent-dark);
}

.btn-primary:disabled {
  background: var(--text-muted);
  cursor: not-allowed;
  transform: none;
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--accent);
  border: 2px solid var(--accent);
}

.btn-secondary:hover {
  background: var(--bg-warm);
}

/* ===== Status Bar ===== */
.status-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  box-shadow: 0 1px 4px var(--shadow);
}

.stat-item {
  flex: 1 1 45%;
  min-width: 0;
}

.stat-label {
  font-size: 0.75rem;
  color: var(--text-light);
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 4px;
}

.stat-bar-track {
  height: 10px;
  background: #eee;
  border-radius: 5px;
  overflow: hidden;
}

.stat-bar-fill {
  height: 100%;
  border-radius: 5px;
  transition: width 0.4s ease, background 0.3s ease;
}

.stat-bar-fill.hp {
  background: linear-gradient(90deg, #7bc47a, #4a9e4a);
}

.stat-bar-fill.hp.danger {
  background: linear-gradient(90deg, #e07070, #c44a4a);
}

.stat-bar-fill.mp {
  background: linear-gradient(90deg, #7a9ec4, #4a6a9e);
}

.stat-bar-fill.mp.danger {
  background: linear-gradient(90deg, #e07070, #c44a4a);
}

.stat-value {
  font-size: 0.75rem;
  text-align: right;
  color: var(--text-light);
  margin-top: 2px;
}

.stat-money {
  font-size: 0.95rem;
  font-weight: 700;
}

.stat-money.danger {
  color: var(--red);
}

/* ===== Mother Status ===== */
.mother-panel {
  background: var(--bg-warm);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 16px;
  font-size: 0.9rem;
}

.mother-panel .mother-title {
  font-weight: 700;
  margin-bottom: 6px;
}

.mother-info {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
}

.mother-info span {
  white-space: nowrap;
}

/* ===== Morning Screen ===== */
.day-header {
  text-align: center;
  font-family: var(--font-serif);
  font-size: 1.4rem;
  color: var(--accent-dark);
  margin: 16px 0;
}

.morning-text {
  background: var(--bg-card);
  border-left: 4px solid var(--accent-light);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 16px 20px;
  margin-bottom: 16px;
  font-size: 0.93rem;
  line-height: 1.9;
}

.morning-text p {
  margin-bottom: 10px;
}

.morning-text p:last-child {
  margin-bottom: 0;
}

.sleep-warning {
  background: var(--red-light);
  border: 1px solid var(--red);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 16px;
  font-size: 0.88rem;
  color: var(--red);
}

/* ===== Allocation Screen ===== */
.alloc-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.remaining-pt {
  font-size: 1.2rem;
  font-weight: 700;
}

.remaining-pt.over {
  color: var(--red);
}

.action-group {
  margin-bottom: 20px;
}

.action-group-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 8px;
  padding-left: 4px;
}

.action-cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.action-card {
  padding: 12px 14px;
}

.action-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.action-name {
  font-weight: 700;
  font-size: 0.95rem;
}

.action-cost {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}

.card.selected .action-cost {
  color: var(--accent);
}

.action-detail {
  font-size: 0.8rem;
  color: var(--text-light);
}

.action-penalty {
  font-size: 0.78rem;
  color: var(--red);
}

.action-bonus {
  font-size: 0.78rem;
  color: var(--green);
}

.action-freed {
  font-size: 0.85rem;
  color: var(--blue);
  font-weight: 500;
}

/* Sleep slider inside card */
.sleep-card {
  cursor: default;
}

.sleep-card:active {
  transform: none;
}

.sleep-slider-wrap {
  margin-top: 8px;
}

.sleep-slider {
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  outline: none;
}

.sleep-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 3px solid #fff;
  box-shadow: 0 1px 4px var(--shadow-md);
}

.sleep-slider::-moz-range-thumb {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 3px solid #fff;
  box-shadow: 0 1px 4px var(--shadow-md);
}

.sleep-value {
  text-align: center;
  font-size: 0.85rem;
  color: var(--text-light);
  margin-top: 4px;
}

/* ===== Result Screen ===== */
.result-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.result-card {
  padding: 12px 14px;
  cursor: default;
}

.result-card:active {
  transform: none;
}

.result-tag {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 6px;
}

.tag-good {
  background: var(--green-light);
  color: var(--green);
}

.tag-bad {
  background: var(--red-light);
  color: var(--red);
}

.tag-info {
  background: var(--blue-light);
  color: var(--blue);
}

.tag-discovery {
  background: var(--green-light);
  color: var(--green);
  border: 1px solid var(--green);
}

.tag-warm {
  background: var(--yellow-light);
  color: #8a7030;
}

.result-text {
  font-size: 0.9rem;
  line-height: 1.7;
}

.reason-text {
  font-size: 0.82rem;
  color: var(--text-light);
  background: var(--bg);
  border-radius: 8px;
  padding: 8px 12px;
  margin-top: 8px;
  line-height: 1.6;
}

/* ===== Event Choice Cards ===== */
.choice-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.choice-card {
  flex: 1;
  padding: 12px;
  font-size: 0.85rem;
  text-align: center;
  min-height: auto;
}

.choice-card.chosen {
  border-color: var(--green);
  background: var(--green-light);
}

.choice-card.not-chosen {
  opacity: 0.3;
  pointer-events: none;
}

/* ===== Night Screen ===== */
.night-header {
  text-align: center;
  font-family: var(--font-serif);
  font-size: 1.3rem;
  color: var(--blue);
  margin: 16px 0;
}

/* ===== Ending Screen ===== */
.ending-title {
  text-align: center;
  font-family: var(--font-serif);
  font-size: 1.6rem;
  color: var(--accent-dark);
  margin: 24px 0 8px;
}

.ending-message {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  margin: 16px 0;
  font-size: 0.93rem;
  line-height: 2;
}

.ending-extra {
  font-size: 0.9rem;
  line-height: 1.8;
  color: var(--text-light);
  border-left: 3px solid var(--accent-light);
  padding: 12px 16px;
  margin: 12px 0;
}

.report-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin: 16px 0;
}

.report-title {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 12px;
  color: var(--accent-dark);
}

.report-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.88rem;
  padding: 4px 0;
  border-bottom: 1px dotted var(--border);
}

.report-row:last-child {
  border-bottom: none;
}

.discovery-list {
  list-style: none;
  padding: 0;
}

.discovery-list li {
  font-size: 0.88rem;
  padding: 3px 0;
  color: var(--green);
}

.discovery-list li::before {
  content: '・';
}

.emotion-section {
  background: var(--bg-warm);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin: 16px 0;
}

.emotion-item {
  font-size: 0.88rem;
  color: var(--text);
  padding: 3px 0;
}

.emotion-item::before {
  content: '・';
  color: var(--text-muted);
}

.emotion-affirm {
  margin-top: 16px;
  font-size: 0.9rem;
  line-height: 1.9;
  color: var(--text-light);
}

.social-message {
  background: var(--blue-light);
  border-radius: var(--radius);
  padding: 20px;
  margin: 20px 0;
  font-size: 0.88rem;
  line-height: 1.9;
  color: var(--text);
}

.social-message a {
  color: var(--blue);
}

/* ===== Game Over ===== */
.gameover-overlay {
  background: rgba(60, 40, 40, 0.15);
  border-radius: var(--radius);
  padding: 20px;
  margin: 16px 0;
  text-align: center;
}

.gameover-text {
  font-family: var(--font-serif);
  font-size: 1.2rem;
  color: var(--red);
  margin-bottom: 12px;
}

/* ===== Utility ===== */
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.mb-24 { margin-bottom: 24px; }
.text-center { text-align: center; }

/* ===== Responsive ===== */
@media (max-width: 375px) {
  #game-container {
    padding: 12px;
  }
  .title-main {
    font-size: 1.8rem;
  }
  .premise-panel {
    padding: 18px 14px;
  }
  .action-card {
    padding: 10px 12px;
  }
  .btn {
    padding: 14px 20px;
  }
}

/* ===== Animations ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.screen.active {
  animation: fadeIn 0.35s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-list .card {
  animation: slideUp 0.3s ease both;
}
.result-list .card:nth-child(2) { animation-delay: 0.06s; }
.result-list .card:nth-child(3) { animation-delay: 0.12s; }
.result-list .card:nth-child(4) { animation-delay: 0.18s; }
.result-list .card:nth-child(5) { animation-delay: 0.24s; }
.result-list .card:nth-child(6) { animation-delay: 0.30s; }
.result-list .card:nth-child(7) { animation-delay: 0.36s; }
.result-list .card:nth-child(8) { animation-delay: 0.42s; }

@keyframes discoveryGlow {
  0%, 100% { box-shadow: 0 2px 8px var(--shadow); }
  50% { box-shadow: 0 0 16px 4px rgba(106, 158, 107, 0.35); }
}

.card.discovery-card {
  animation: slideUp 0.3s ease both, discoveryGlow 1.5s ease 0.5s 2;
}

.gameover-overlay {
  animation: fadeIn 0.8s ease;
}

.ending-title {
  animation: fadeIn 0.6s ease;
}

.ending-extra {
  animation: slideUp 0.4s ease both;
}
</style>
</head>
<body>

<div id="game-container">

  <!-- Title Screen -->
  <div id="screen-title" class="screen active">
    <div class="title-header">
      <h1 class="title-main" id="title-main"></h1>
      <p class="title-sub" id="title-sub"></p>
    </div>
    <div class="premise-panel" id="premise-panel"></div>
    <button class="btn btn-primary" id="btn-start" onclick="startGame()"></button>
  </div>

  <!-- Morning Screen -->
  <div id="screen-morning" class="screen"></div>

  <!-- Policy Screen -->
  <div id="screen-policy" class="screen"></div>

  <!-- Allocation Screen -->
  <div id="screen-alloc" class="screen"></div>

  <!-- Result Screen -->
  <div id="screen-result" class="screen"></div>

  <!-- Night Screen -->
  <div id="screen-night" class="screen"></div>

  <!-- Ending Screen -->
  <div id="screen-ending" class="screen"></div>

</div>

/* ================================================================
   Utility: Text template
   ================================================================ */
function t(template, replacements) {
  let s = template;
  for (const [key, val] of Object.entries(replacements)) {
    s = s.replace(new RegExp('\\{' + key + '\\}', 'g'), val);
  }
  return s;
}

/** Convert \n in text to <br> for HTML rendering */
function nl2br(text) {
  return text.replace(/\n/g, '<br>');
}

/** Pick MP-linked tone variant: [0]=normal, [1]=tired, [2]=exhausted, [3]=broken */
function toneText(variants) {
  if (G.mp >= 8) return variants[0];
  if (G.mp >= 5) return variants[1];
  if (G.mp >= 3) return variants[2];
  return variants[3];
}

/* ================================================================
   Morning: Determine Mother's Mood
   ================================================================ */
function determineMotherMood() {
  const day = G.day;
  const rand = Math.random() * 100;

  // Uneasy probability
  let uneasyCap = 15 + (day - 1) * 7;
  if (G.medsSkippedYesterday) uneasyCap += 15;

  // Refuse probability
  let refuseCap = 0;
  if (day >= 5) refuseCap = 15;
  else if (day >= 3) refuseCap = 8;

  // Good (calm) probability
  let goodCap = 12;
  // Meal mastery bonus
  if (G.mealMastered) goodCap += 10;

  // Music bonus from previous day (tracked via a temp flag)
  if (G._musicBonusNextDay) {
    goodCap += 20;
    G._musicBonusNextDay = false;
  }

  // Roll: refuse -> uneasy -> good -> normal
  if (rand < refuseCap) {
    G.motherMood = 'refuse';
  } else if (rand < refuseCap + uneasyCap) {
    G.motherMood = 'uneasy';
  } else if (rand < refuseCap + uneasyCap + goodCap) {
    G.motherMood = 'good';
  } else {
    G.motherMood = 'normal';
  }
}


/* ================================================================
   Render: Morning Screen
   ================================================================ */
function renderMorning() {
  determineMotherMood();

  const day = G.day;
  const screen = document.getElementById('screen-morning');
  let html = '';

  // Day header
  html += `<h2 class="day-header">${t(LANG.ui.day, { n: day })}</h2>`;

  // Status bar
  html += renderStatus();

  // Sleep warning (from previous night, Day 2+)
  if (day > 1) {
    if (G.prevSleep <= 1) {
      html += `<div class="sleep-warning">${LANG.sleepWarning.severe}</div>`;
    } else if (G.prevSleep <= 3) {
      html += `<div class="sleep-warning">${LANG.sleepWarning.moderate}</div>`;
    }
  }

  // Meal mastery morning message
  if (G.mealMastered) {
    html += `<div class="card" style="background:var(--green-light);border-color:var(--green);cursor:default;margin-bottom:16px;">
      <div class="action-bonus" style="font-size:0.9rem;">🍚 ${LANG.ui.masteredMeal}</div>
    </div>`;
  }

  // Policy-based Day 1 extra text
  if (day === 1 && G.policy) {
    const polData = LANG.ui.policy[G.policy];
    if (polData && polData.morning1) {
      html += `<div class="morning-text" style="border-left-color:var(--accent);"><p>${polData.morning1}</p></div>`;
    }
  }

  // Morning flavor text
  html += '<div class="morning-text">';
  const flavorText = LANG.morning[day - 1] || LANG.morning[0];
  flavorText.split('\n').forEach(line => {
    html += `<p>${line}</p>`;
  });
  html += '</div>';

  // Fixed events for Day 3, Day 5
  if (LANG.morningFixed[day]) {
    html += '<div class="morning-text" style="border-left-color:var(--yellow);">';
    LANG.morningFixed[day].split('\n').forEach(line => {
      html += `<p>${line}</p>`;
    });
    html += '</div>';
  }

  // Button to go to allocation
  html += `<button class="btn btn-primary" onclick="goToAlloc()">${LANG.ui.allocTitle}</button>`;

  screen.innerHTML = html;
  showScreen('screen-morning');
}


/* ================================================================
   Allocation: State
   ================================================================ */
let allocState = {
  selected: new Set(),     // Set of selected action ids
  freedActions: new Set(), // Actions freed by services
  sleepPt: 8,              // Sleep slider value
  workChoice: null,        // 'workFull' | 'workHalf' | null
};

function resetAllocState() {
  allocState = {
    selected: new Set(),
    freedActions: new Set(),
    sleepPt: 8,
    workChoice: null,
  };
}


/* ================================================================
   Allocation: Get action definitions
   ================================================================ */
function getActions() {
  const isRefuse = G.motherMood === 'refuse';
  const refuseExtra = isRefuse ? 1 : 0;

  // Base toilet cost, reduced by mastery; +1 when mother's health is critical
  let toiletCost = G.toiletMastered ? 1 : (2 + refuseExtra);
  if (G.motherHealth <= 1 && !G.toiletMastered) toiletCost += 1;
  // Base meds cost, reduced by mastery
  const medsCost = G.medsMastered ? 0 : (1 + refuseExtra);

  return {
    // --- External Services ---
    dayService: {
      id: 'dayService', group: 'service', pt: 0,
      cost: -LANG.locale.services.dayService.cost,
      frees: ['meal_m', 'meal_l', 'meal_e', 'toilet', 'watch'],
    },
    visitCare: {
      id: 'visitCare', group: 'service', pt: 0,
      cost: -LANG.locale.services.visitCare.cost,
      frees: ['toilet'],
    },

    // --- Care ---
    meal_m: { id: 'meal_m', group: 'care', pt: 2 + refuseExtra },
    meal_l: { id: 'meal_l', group: 'care', pt: 2 + refuseExtra },
    meal_e: { id: 'meal_e', group: 'care', pt: 2 + refuseExtra },
    toilet: { id: 'toilet', group: 'care', pt: toiletCost },
    meds:   { id: 'meds',   group: 'care', pt: medsCost },
    watch:  { id: 'watch',  group: 'care', pt: 1 + refuseExtra },

    // --- Life ---
    myMeal:    { id: 'myMeal',    group: 'life', pt: 1 },
    sleep:     { id: 'sleep',     group: 'life', pt: 0, isSleep: true },
    housework: { id: 'housework', group: 'life', pt: 2 },

    // --- Work ---
    workFull: { id: 'workFull', group: 'work', pt: 8, income: LANG.locale.workIncome.full, exclusive: 'work' },
    workHalf: { id: 'workHalf', group: 'work', pt: 4, income: LANG.locale.workIncome.half, exclusive: 'work' },

    // --- Recovery ---
    rest:       { id: 'rest',       group: 'recovery', pt: 2 },
    callFriend: { id: 'callFriend', group: 'recovery', pt: 1 },

    // --- Environment (Day 2+, one-time) ---
    nightLight:     { id: 'nightLight',     group: 'env', pt: 1, cost: -LANG.locale.envCosts.nightLight },
    toiletSign:     { id: 'toiletSign',     group: 'env', pt: 1, cost: -LANG.locale.envCosts.toiletSign },
    entranceSensor: { id: 'entranceSensor', group: 'env', pt: 1, cost: -LANG.locale.envCosts.entranceSensor },

    // --- Joy (calm mother only) ---
    music: { id: 'music', group: 'joy', pt: 1 },
    album: { id: 'album', group: 'joy', pt: 1 },
  };
}


/* ================================================================
   Allocation: Calculate remaining points
   ================================================================ */
function calcRemaining() {
  const actions = getActions();
  let used = allocState.sleepPt;
  for (const id of allocState.selected) {
    if (allocState.freedActions.has(id)) continue;
    const a = actions[id];
    if (a) used += a.pt;
  }
  if (allocState.workChoice) {
    used += actions[allocState.workChoice].pt;
  }
  return 24 - used;
}


/* ================================================================
   Allocation: Toggle helpers
   ================================================================ */
function toggleService(id) {
  if (G.policy === 'solo') return;
  const actions = getActions();
  const svc = actions[id];
  if (!svc) return;

  if (allocState.selected.has(id)) {
    allocState.selected.delete(id);
    // Un-free actions
    if (svc.frees) {
      svc.frees.forEach(fid => allocState.freedActions.delete(fid));
    }
  } else {
    // Check day service weekly limit
    if (id === 'dayService' && G.dayServiceUsedThisWeek >= 2) return;
    // Check money
    if (svc.cost && G.money + svc.cost < 0) return;
    allocState.selected.add(id);
    if (svc.frees) {
      svc.frees.forEach(fid => allocState.freedActions.add(fid));
    }
  }
  renderAlloc();
}

function toggleWork(id) {
  // Work policy: cannot change
  if (G.policy === 'work') return;
  if (allocState.workChoice === id) {
    allocState.workChoice = null;
  } else {
    allocState.workChoice = id;
  }
  renderAlloc();
}

function toggleAction(id) {
  if (allocState.selected.has(id)) {
    allocState.selected.delete(id);
  } else {
    allocState.selected.add(id);
  }
  renderAlloc();
}

function setSleep(val) {
  allocState.sleepPt = parseInt(val, 10);
  renderAlloc();
}


/* ================================================================
   Allocation: Render
   ================================================================ */
function renderAlloc(isInitial) {
  const screen = document.getElementById('screen-alloc');
  const actions = getActions();
  const remaining = calcRemaining();
  const day = G.day;

  // Save scroll position before re-render
  const scrollY = isInitial ? 0 : window.scrollY;

  let html = '';

  // Day header
  html += `<h2 class="day-header">${t(LANG.ui.day, { n: day })}</h2>`;

  // Status bar
  html += renderStatus();

  // Day 1: explain that points = hours
  if (day === 1) {
    html += `<div style="text-align:center;font-size:0.82rem;color:var(--text-light);margin-bottom:4px;">${LANG.ui.allocExplain}</div>`;
  }

  // Remaining points header
  const overClass = remaining < 0 ? ' over' : '';
  html += `<div class="alloc-header">
    <span class="remaining-pt${overClass}">${t(LANG.ui.remaining, { n: remaining })}</span>
  </div>`;

  if (remaining < 0) {
    html += `<div class="sleep-warning" style="margin-bottom:12px;">${t(LANG.ui.overWarning, { n: Math.abs(remaining) })}</div>`;
  }

  // --- Group order: service -> care -> life -> work -> recovery -> env -> joy ---
  const groups = [
    { key: 'service', ids: ['dayService', 'visitCare'] },
    { key: 'care',    ids: ['meal_m', 'meal_l', 'meal_e', 'toilet', 'meds', 'watch'] },
    { key: 'life',    ids: ['myMeal', 'sleep', 'housework'] },
    { key: 'work',    ids: ['workFull', 'workHalf'] },
    { key: 'recovery', ids: ['rest', 'callFriend'] },
    { key: 'env',     ids: ['nightLight', 'toiletSign', 'entranceSensor'] },
    { key: 'joy',     ids: ['music', 'album'] },
  ];

  for (const group of groups) {
    // Environment: only Day 2+
    if (group.key === 'env' && day < 2) continue;
    // Solo policy: hide service group entirely
    if (group.key === 'service' && G.policy === 'solo') continue;
    // Joy: always show group but cards may be disabled

    html += `<div class="action-group">`;
    html += `<div class="action-group-title">${LANG.actionGroups[group.key]}</div>`;
    html += `<div class="action-cards">`;

    for (const id of group.ids) {
      const a = actions[id];
      if (!a) continue;
      const lang = LANG.actions[id];

      // Environment: already installed
      if (group.key === 'env' && G[id] === true) {
        html += `<div class="card action-card completed env">
          <div class="action-card-top">
            <span class="action-name">${lang.name}</span>
          </div>
        </div>`;
        continue;
      }

      // Sleep: special slider card
      if (a.isSleep) {
        html += renderSleepCard(lang);
        continue;
      }

      // Determine card state
      let cardClass = 'card action-card';
      let isSelected = false;
      let isFreed = allocState.freedActions.has(id);
      let isDisabled = false;
      let extraInfo = '';

      if (group.key === 'service') {
        isSelected = allocState.selected.has(id);
        if (isSelected) cardClass += ' selected';
        // Show cost
        const svcCost = Math.abs(a.cost);
        extraInfo = `<div class="action-detail">💰 -${LANG.locale.currencyFormat(svcCost)}</div>`;
        // Day service weekly limit
        if (id === 'dayService') {
          const dsRemaining = 2 - G.dayServiceUsedThisWeek;
          if (dsRemaining <= 0) {
            extraInfo += `<div class="action-penalty">${LANG.ui.serviceLimit.exhausted}</div>`;
            extraInfo += `<div class="action-penalty" style="font-weight:700;color:var(--red);">0 / 2 回</div>`;
            cardClass += ' disabled';
            isDisabled = true;
          } else {
            extraInfo += `<div class="action-detail">${t(LANG.ui.serviceLimit.remaining, { n: dsRemaining })}</div>`;
          }
        }
        // Disable if not enough money
        if (!isSelected && !isDisabled && G.money < svcCost) {
          cardClass += ' disabled';
          isDisabled = true;
        }
      } else if (group.key === 'work') {
        isSelected = allocState.workChoice === id;
        if (isSelected) cardClass += ' selected';
        const incomeAmt = a.income;
        extraInfo = `<div class="action-detail">💰 +${LANG.locale.currencyFormat(incomeAmt)}</div>`;
        // Work policy: fulltime forced, half disabled
        if (G.policy === 'work') {
          if (id === 'workFull') {
            cardClass += ' selected';
            isSelected = true;
            isDisabled = true;
            extraInfo += `<div class="action-penalty">${LANG.ui.workFixed}</div>`;
          } else {
            cardClass += ' disabled';
            isDisabled = true;
          }
        }
      } else if (group.key === 'env') {
        isSelected = allocState.selected.has(id);
        if (isSelected) cardClass += ' selected';
        cardClass += ' env';
        const envCost = a.cost ? Math.abs(a.cost) : 0;
        extraInfo = '';
        if (envCost > 0) {
          extraInfo += `<div class="action-detail">💰 -${LANG.locale.currencyFormat(envCost)}</div>`;
        } else {
          extraInfo += `<div class="action-detail">💰 ${LANG.locale.currencyFormat(0)}</div>`;
        }
        extraInfo += `<div class="action-bonus">${LANG.ui.envHint}</div>`;
        // Disable if not enough money
        if (!isSelected && envCost > 0 && G.money < envCost) {
          cardClass += ' disabled';
          isDisabled = true;
        }
      } else if (group.key === 'joy') {
        isSelected = allocState.selected.has(id);
        if (isSelected) cardClass += ' selected';
        cardClass += ' joy';
        // Disable if mother not calm
        if (G.motherMood !== 'good') {
          cardClass += ' disabled';
          isDisabled = true;
          extraInfo = `<div class="action-penalty">${LANG.ui.joyUnavailable}</div>`;
        }
      } else {
        // Regular care/life/recovery actions
        isSelected = allocState.selected.has(id);
        if (isSelected) cardClass += ' selected';
        if (isFreed) {
          // Show freed state
          extraInfo = `<div class="action-freed">${LANG.ui.freed}</div>`;
        }
      }

      // Mastery indicators
      if (id === 'toilet' && G.toiletMastered) {
        extraInfo += `<div class="action-bonus">${LANG.ui.masteredToilet}</div>`;
      }
      if (id === 'meds' && G.medsMastered) {
        extraInfo += `<div class="action-bonus">${LANG.ui.masteredMeds}</div>`;
      }

      // Build onclick
      let onclick = '';
      if (!isDisabled) {
        if (group.key === 'service') {
          onclick = `onclick="toggleService('${id}')"`;
        } else if (group.key === 'work') {
          onclick = `onclick="toggleWork('${id}')"`;
        } else {
          onclick = `onclick="toggleAction('${id}')"`;
        }
      }

      // Cost display
      const ptCost = isFreed ? 0 : a.pt;
      const costText = t(LANG.ui.costUnit, { n: ptCost });

      // Skip penalty
      let penaltyHtml = '';
      if (lang.skip && !isFreed && group.key !== 'service' && group.key !== 'work' && group.key !== 'env' && group.key !== 'joy') {
        penaltyHtml = `<div class="action-penalty">${LANG.ui.skipPenalty}${lang.skip}</div>`;
      }

      // Detail text
      let detailHtml = '';
      if (lang.detail && group.key !== 'joy') {
        detailHtml = `<div class="action-detail">${lang.detail}</div>`;
      }

      html += `<div class="${cardClass}" ${onclick}>
        <div class="action-card-top">
          <span class="action-name">${lang.name}</span>
          <span class="action-cost">${costText}</span>
        </div>
        ${detailHtml}
        ${extraInfo}
        ${!isSelected ? penaltyHtml : ''}
      </div>`;
    }

    html += `</div></div>`;
  }

  // Confirm button
  const canConfirm = remaining >= 0;
  html += `<button class="btn btn-primary" ${canConfirm ? '' : 'disabled'} onclick="confirmDay()">${LANG.ui.startDay}</button>`;

  screen.innerHTML = html;

  if (isInitial) {
    showScreen('screen-alloc');
  } else {
    // Restore scroll position after re-render (card toggle)
    window.scrollTo(0, scrollY);
  }
}

function renderSleepCard(lang) {
  return `<div class="card action-card sleep-card">
    <div class="action-card-top">
      <span class="action-name">${lang.name}</span>
      <span class="action-cost">${t(LANG.ui.costUnit, { n: allocState.sleepPt })}</span>
    </div>
    <div class="sleep-slider-wrap">
      <input type="range" class="sleep-slider" min="0" max="8" value="${allocState.sleepPt}"
        oninput="setSleep(this.value)">
      <div class="sleep-value">${t(LANG.ui.sleepPt, { n: allocState.sleepPt })}</div>
    </div>
    ${allocState.sleepPt <= 2 ? `<div class="action-penalty">${lang.skip}</div>` : ''}
  </div>`;
}


/* ================================================================
   Go to Allocation Screen
   ================================================================ */
function goToAlloc() {
  resetAllocState();
  // Work policy: force fulltime
  if (G.policy === 'work') {
    allocState.workChoice = 'workFull';
  }
  renderAlloc(true);
}


/* ================================================================
   Step 4: Confirm Day — Judgment Phase
   ================================================================ */
let dayResults = [];       // Array of result card objects for display
let pendingChoices = 0;    // Count of unresolved event choices

function confirmDay() {
  const remaining = calcRemaining();
  if (remaining < 0) return;

  dayResults = [];
  pendingChoices = 0;
  const actions = getActions();
  const sel = allocState.selected;
  const freed = allocState.freedActions;

  // --- Failure check (sleep deprivation) ---
  let failRate = 0;
  if (G.prevSleep <= 1) failRate = 0.35;
  else if (G.prevSleep <= 3) failRate = 0.20;
  else if (G.prevSleep <= 4) failRate = 0.15;
  // toiletSign halves failure rate for toilet
  const toiletFailRate = G.toiletSign ? failRate / 2 : failRate;

  function didFail(rate) { return Math.random() < rate; }

  // --- Daily supply cost ---
  G.money -= LANG.locale.supplyCost;
  dayResults.push({ tag: 'info', text: `日用品費: -${LANG.locale.currencyFormat(LANG.locale.supplyCost)}` });

  // --- Fixed cost on Day 4 and Day 7 ---
  if (G.day === 4 || G.day === 7) {
    G.money -= G.weeklyFixedCost;
    dayResults.push({ tag: 'info', text: `固定費引き落とし: -${LANG.locale.currencyFormat(G.weeklyFixedCost)}` });
  }

  // --- Service processing (with rejection probability) ---
  let dayServiceRejected = false;
  let visitCareRejected = false;

  if (sel.has('dayService')) {
    const rejectRate = G.day >= 5 ? 0.25 : 0.15;
    if (Math.random() < rejectRate) {
      dayServiceRejected = true;
      G.serviceWasRejected = true;
      dayResults.push({ tag: 'bad', text: LANG.serviceRejected.dayService });
      G.emotionLog.push(LANG.serviceRejectedEmotion.dayService);
    } else {
      G.money -= LANG.locale.services.dayService.cost;
      G.usedService++;
      G.dayServiceUsedThisWeek++;
      dayResults.push({ tag: 'good', text: `${LANG.actions.dayService.name}を利用した。食事・排泄・見守りを任せられた。` });
    }
  }
  if (sel.has('visitCare')) {
    const rejectRate = G.day >= 5 ? 0.20 : 0.10;
    if (Math.random() < rejectRate) {
      visitCareRejected = true;
      G.serviceWasRejected = true;
      dayResults.push({ tag: 'bad', text: LANG.serviceRejected.visitCare });
      G.emotionLog.push(LANG.serviceRejectedEmotion.visitCare);
    } else {
      G.money -= LANG.locale.services.visitCare.cost;
      G.usedService++;
      dayResults.push({ tag: 'good', text: `${LANG.actions.visitCare.name}を利用した。排泄介助を任せられた。` });
    }
  }

  // Recalculate freed actions: only non-rejected services provide frees
  freed.clear();
  if (sel.has('dayService') && !dayServiceRejected) {
    (actions.dayService.frees || []).forEach(fid => freed.add(fid));
  }
  if (sel.has('visitCare') && !visitCareRejected) {
    (actions.visitCare.frees || []).forEach(fid => freed.add(fid));
  }

  // --- Meal processing ---
  const mealIds = ['meal_m', 'meal_l', 'meal_e'];
  let mealsToday = 0;
  for (const mid of mealIds) {
    const isFreed = freed.has(mid);
    const isDone = sel.has(mid) || isFreed;
    if (isDone) {
      if (!isFreed && didFail(failRate)) {
        dayResults.push({ tag: 'bad', text: `${LANG.actions[mid].name}——寝不足でうまくいかなかった。` });
        G.motherHealth = Math.max(0, G.motherHealth - 1);
      } else {
        mealsToday++;
        G.mealsServed++;
      }
    } else {
      G.motherHealth = Math.max(0, G.motherHealth - 1);
      G.skippedMeals++;
      dayResults.push({ tag: 'bad', text: `${LANG.actions[mid].name}をスキップした。母の健康が悪化。` });
    }
  }
  // Meal streak
  if (mealsToday === 3) {
    G.mealStreak++;
  } else {
    G.mealStreak = 0;
  }
  // Meal mastery check
  if (!G.mealMastered && G.mealStreak >= 3) {
    G.mealMastered = true;
    G.discoveryCount++;
    dayResults.push({ tag: 'discovery', text: LANG.learning.meal });
  }

  // --- Toilet processing ---
  {
    const isFreed = freed.has('toilet');
    const isDone = sel.has('toilet') || isFreed;
    if (isDone) {
      if (!isFreed && didFail(toiletFailRate)) {
        dayResults.push({ tag: 'bad', text: `${LANG.actions.toilet.name}——寝不足でうまくいかなかった。` });
        G.mp = Math.max(0, G.mp - 1);
        G.toiletStreak = 0;
      } else {
        G.toiletStreak++;
      }
    } else {
      G.mp = Math.max(0, G.mp - 1);
      G.toiletStreak = 0;
      dayResults.push({ tag: 'bad', text: `${LANG.actions.toilet.name}をスキップ。メンタルが削られた。` });
    }
    if (!G.toiletMastered && G.toiletStreak >= 3) {
      G.toiletMastered = true;
      G.discoveryCount++;
      dayResults.push({ tag: 'discovery', text: LANG.learning.toilet });
    }
  }

  // --- Meds processing ---
  {
    const isFreed = freed.has('meds');
    const isDone = sel.has('meds') || isFreed || (G.medsMastered);
    if (isDone) {
      if (!isFreed && !G.medsMastered && didFail(failRate)) {
        dayResults.push({ tag: 'bad', text: `${LANG.actions.meds.name}——寝不足でうまくいかなかった。` });
        G.medsSkippedYesterday = true;
        G.medsStreak = 0;
      } else {
        G.medsSkippedYesterday = false;
        G.medsStreak++;
      }
    } else {
      G.medsSkippedYesterday = true;
      G.medsStreak = 0;
      dayResults.push({ tag: 'bad', text: `${LANG.actions.meds.name}をスキップ。明日、不穏になるリスクが上がった。` });
    }
    if (!G.medsMastered && G.medsStreak >= 3) {
      G.medsMastered = true;
      G.discoveryCount++;
      dayResults.push({ tag: 'discovery', text: LANG.learning.meds });
    }
  }

  // --- Watch processing ---
  {
    const isFreed = freed.has('watch');
    const isDone = sel.has('watch') || isFreed;
    if (!isDone) {
      dayResults.push({ tag: 'bad', text: `${LANG.actions.watch.name}をスキップ。突発イベントが起きやすくなった。` });
    }
    // Watch skip flag for event probability
    G._watchSkipped = !isDone;
  }

  // --- My meal ---
  if (sel.has('myMeal')) {
    // ok
  } else {
    G.hp = Math.max(0, G.hp - 1);
    G.skippedMeals++;
    dayResults.push({ tag: 'bad', text: toneText(LANG.tone.myMealSkip) });
  }

  // --- Housework ---
  if (sel.has('housework')) {
    G.skipHousework = 0;
  } else {
    G.skipHousework++;
    if (G.skipHousework >= 2) {
      G.motherHealth = Math.max(0, G.motherHealth - 1);
      dayResults.push({ tag: 'bad', text: '家事を2日連続でスキップ。生活環境が悪化し、母の健康に影響。' });
    } else {
      dayResults.push({ tag: 'info', text: '家事をスキップした。明日もスキップすると母の健康に影響する。' });
    }
  }

  // --- Work ---
  if (allocState.workChoice === 'workFull') {
    G.money += LANG.locale.workIncome.full;
    G.workedDays++;
    dayResults.push({ tag: 'info', text: `フルタイム勤務。+${LANG.locale.currencyFormat(LANG.locale.workIncome.full)}` });
  } else if (allocState.workChoice === 'workHalf') {
    G.money += LANG.locale.workIncome.half;
    G.workedDays++;
    dayResults.push({ tag: 'info', text: `時短勤務。+${LANG.locale.currencyFormat(LANG.locale.workIncome.half)}` });
  }

  // --- Rest ---
  if (sel.has('rest')) {
    G.mp = Math.min(G.maxMp, G.mp + 2);
    G.restDays++;
    dayResults.push({ tag: 'good', text: toneText(LANG.tone.rest) });
  }

  // --- Call friend ---
  if (sel.has('callFriend')) {
    G.calledFriendCount++;
    const mpGain = G.foundPeerSupport ? 2 : 1;
    G.mp = Math.min(G.maxMp, G.mp + mpGain);
    dayResults.push({ tag: 'good', text: t(toneText(LANG.tone.callFriend), { n: mpGain }) });

    if (G.calledFriendCount === 2 && !G.foundPeerSupport) {
      G.foundPeerSupport = true;
      G.discoveryCount++;
      dayResults.push({ tag: 'discovery', text: LANG.support.peerFound });
    }
  }

  // --- Environment improvements ---
  if (sel.has('nightLight') && !G.nightLight) {
    G.nightLight = true;
    G.money -= LANG.locale.envCosts.nightLight;
    G.discoveryCount++;
    dayResults.push({ tag: 'discovery', text: LANG.envMessages.nightLight });
  }
  if (sel.has('toiletSign') && !G.toiletSign) {
    G.toiletSign = true;
    G.money -= LANG.locale.envCosts.toiletSign;
    G.discoveryCount++;
    dayResults.push({ tag: 'discovery', text: LANG.envMessages.toiletSign });
  }
  if (sel.has('entranceSensor') && !G.entranceSensor) {
    G.entranceSensor = true;
    G.money -= LANG.locale.envCosts.entranceSensor;
    G.discoveryCount++;
    dayResults.push({ tag: 'discovery', text: LANG.envMessages.entranceSensor });
  }

  // --- Joy actions ---
  if (sel.has('music')) {
    G.mp = Math.min(G.maxMp, G.mp + 2);
    G.musicPlayed = true;
    G._musicBonusNextDay = true;
    dayResults.push({ tag: 'warm', text: LANG.joyMessages.music });
    G.emotionLog.push(LANG.joyMessages.musicEmotion);
  }
  if (sel.has('album')) {
    G.mp = Math.min(G.maxMp, G.mp + 2);
    G.albumWatched = true;
    G.peacefulCount++;
    dayResults.push({ tag: 'warm', text: LANG.joyMessages.album });
    G.emotionLog.push(LANG.joyMessages.albumEmotion);
  }

  // --- Sudden events ---
  processSuddenEvent();

  // --- Pamphlet event (Day 5 or 6, once) ---
  processPamphletEvent();

  // --- Game over check ---
  checkGameOver();

  // --- Save sleep pt for night phase ---
  G._allocSleepPt = allocState.sleepPt;
  G.totalSleepPt += allocState.sleepPt;

  // --- Render result screen ---
  renderResult();
}


/* ================================================================
   Sudden Event Processing
   ================================================================ */
function processSuddenEvent() {
  // Calculate event probability
  let eventProb = 0.30;
  if (G._watchSkipped) eventProb += 0.20;
  if (G.motherMood === 'uneasy') eventProb += 0.15;
  if (G.motherMood === 'refuse') eventProb += 0.10;

  if (Math.random() >= eventProb) {
    // No sudden event — chance for peaceful moment
    if (Math.random() < 0.20) {
      const peaceText = LANG.peaceful[Math.floor(Math.random() * LANG.peaceful.length)];
      G.mp = Math.min(G.maxMp, G.mp + 1);
      G.hadPeacefulMoment = true;
      G.peacefulCount++;
      dayResults.push({ tag: 'warm', text: t(toneText(LANG.tone.peaceful), { text: peaceText }) });
    }
    return;
  }

  // Build available event pool based on day
  const pool = ['theft_delusion', 'go_home', 'fall'];
  if (G.day >= 4) pool.push('wander');
  if (G.day >= 5) pool.push('verbal_abuse');

  const eventId = pool[Math.floor(Math.random() * pool.length)];
  const ev = LANG.events[eventId];

  // Track seen count
  if (!G.seenEvents[eventId]) G.seenEvents[eventId] = 0;
  const seenBefore = G.seenEvents[eventId];
  G.seenEvents[eventId]++;

  // Log emotion
  G.emotionLog.push(ev.emotion);

  // Determine display mode
  const hasChoices = ev.choiceA && ev.choiceB;
  const isFirstTime = seenBefore === 0;
  const alreadyLearned = G.learnedCoping[eventId] === true;

  if (alreadyLearned && hasChoices) {
    // Auto-apply best response
    const dmg = ev.choiceB.mp;
    let finalMp = dmg;
    // Entrance sensor bonus for wander
    if (eventId === 'wander' && G.entranceSensor) finalMp = Math.max(finalMp + 1, 0);
    G.mp = Math.max(0, G.mp + finalMp);
    G.hp = Math.max(0, G.hp + (ev.hp || 0));
    dayResults.push({
      tag: 'info',
      text: ev.text,
      reason: ev.reason,
      autoResponse: LANG.pamphlet.learnedAuto,
    });
  } else if (!isFirstTime && hasChoices) {
    // Show reason + choices (2nd time)
    pendingChoices++;
    dayResults.push({
      tag: 'bad',
      text: ev.text,
      reason: ev.reason,
      eventId: eventId,
      needsChoice: true,
    });
  } else {
    // First time or no choices (fall) — apply damage directly
    G.mp = Math.max(0, G.mp + (ev.mp || 0));
    G.hp = Math.max(0, G.hp + (ev.hp || 0));
    // Entrance sensor bonus for wander
    if (eventId === 'wander' && G.entranceSensor) {
      G.mp = Math.min(G.maxMp, G.mp + 1);
    }
    let resultObj = { tag: 'bad', text: ev.text };
    if (!isFirstTime) {
      resultObj.reason = ev.reason;
    }
    dayResults.push(resultObj);
  }
}


/* ================================================================
   Event Choice Handler
   ================================================================ */
function handleEventChoice(eventId, choice) {
  const ev = LANG.events[eventId];
  const choiceData = choice === 'B' ? ev.choiceB : ev.choiceA;

  let finalMp = choiceData.mp;

  // Entrance sensor bonus for wander + choice B
  if (eventId === 'wander' && choice === 'B' && G.entranceSensor) {
    finalMp = Math.max(finalMp + 1, 0);
  }

  G.mp = Math.max(0, G.mp + finalMp);
  G.hp = Math.max(0, G.hp + (ev.hp || 0));

  // If chose B and first time learning
  if (choice === 'B' && !G.learnedCoping[eventId]) {
    G.learnedCoping[eventId] = true;
    G.discoveryCount++;
  }

  pendingChoices--;

  // Update card UI
  const card = document.getElementById(`event-card-${eventId}`);
  if (card) {
    const choicesDiv = card.querySelector('.choice-row');
    if (choicesDiv) {
      const cards = choicesDiv.querySelectorAll('.choice-card');
      cards.forEach((c, i) => {
        if ((choice === 'A' && i === 0) || (choice === 'B' && i === 1)) {
          c.classList.add('chosen');
        } else {
          c.classList.add('not-chosen');
        }
      });
    }

    // Show result text
    const resultDiv = document.createElement('div');
    resultDiv.className = 'result-text';
    resultDiv.style.marginTop = '10px';
    if (choice === 'B' && ev.choiceB.learnMsg) {
      resultDiv.innerHTML = `<span class="result-tag tag-discovery">発見</span><br>${nl2br(ev.choiceB.learnMsg)}`;
    } else {
      resultDiv.innerHTML = `<span class="result-tag tag-bad">ダメージ</span> メンタル${choiceData.mp}`;
    }
    card.appendChild(resultDiv);
  }

  // Update status bar in result screen
  const statusEl = document.getElementById('result-status');
  if (statusEl) statusEl.innerHTML = renderStatus();

  // Enable the "to night" button if all choices resolved
  checkGameOver();
  updateToNightButton();
}


/* ================================================================
   Pamphlet Event (Day 5 or 6, once)
   ================================================================ */
function processPamphletEvent() {
  if (G.receivedPamphlet) return;
  if (G.day !== 5 && G.day !== 6) return;
  if (!(G.motherHealth <= 2 || G.hp <= 5 || G.mp <= 5)) return;

  G.receivedPamphlet = true;
  const pamphletText = t(LANG.pamphlet.text, { facility: LANG.locale.pamphletText });

  pendingChoices++;
  dayResults.push({
    tag: 'info',
    text: pamphletText,
    isPamphlet: true,
    notePrompt: LANG.pamphlet.notePrompt,
  });
}


/* ================================================================
   Pamphlet Note Choice Handler
   ================================================================ */
function handleNoteChoice(choice) {
  pendingChoices--;

  if (choice === 'yes') {
    G.madeBackupNote = true;
    G.discoveryCount++;
  }

  const card = document.getElementById('event-card-pamphlet');
  if (card) {
    const choicesDiv = card.querySelector('.choice-row');
    if (choicesDiv) {
      const cards = choicesDiv.querySelectorAll('.choice-card');
      cards.forEach((c, i) => {
        if ((choice === 'yes' && i === 0) || (choice === 'no' && i === 1)) {
          c.classList.add('chosen');
        } else {
          c.classList.add('not-chosen');
        }
      });
    }

    const resultDiv = document.createElement('div');
    resultDiv.className = 'result-text';
    resultDiv.style.marginTop = '10px';
    const msg = choice === 'yes' ? LANG.pamphlet.noteYesMsg : LANG.pamphlet.noteNoMsg;
    const tagClass = choice === 'yes' ? 'tag-discovery' : 'tag-info';
    const tagLabel = choice === 'yes' ? '発見' : '';
    resultDiv.innerHTML = tagLabel ? `<span class="result-tag ${tagClass}">${tagLabel}</span><br>${nl2br(msg)}` : nl2br(msg);
    card.appendChild(resultDiv);
  }

  updateToNightButton();
}


/* ================================================================
   Game Over Check
   ================================================================ */
function checkGameOver() {
  if (G.hp <= 0 && !G.gameOver) {
    G.gameOver = true;
    G.gameOverReason = 'hp';
  }
  if (G.mp <= 0 && !G.gameOver) {
    G.gameOver = true;
    G.gameOverReason = 'mp';
  }
}


/* ================================================================
   Update "To Night" Button State
   ================================================================ */
function updateToNightButton() {
  const btn = document.getElementById('btn-to-night');
  if (!btn) return;
  if (G.gameOver) {
    btn.textContent = LANG.ui.seeResult;
    btn.disabled = false;
    btn.onclick = () => { goToEnding(); };
  } else if (pendingChoices <= 0) {
    btn.disabled = false;
  }
}


/* ================================================================
   Render: Result Screen
   ================================================================ */
function renderResult() {
  const screen = document.getElementById('screen-result');
  let html = '';

  // Day header
  html += `<h2 class="day-header">${t(LANG.ui.day, { n: G.day })} — 日中の結果</h2>`;

  // Status bar (will be updated dynamically)
  html += `<div id="result-status">${renderStatus()}</div>`;

  // Result cards
  html += '<div class="result-list">';
  for (const r of dayResults) {
    html += renderResultCard(r);
  }
  html += '</div>';

  // Game over display
  if (G.gameOver) {
    html += `<div class="gameover-overlay">
      <div class="gameover-text">${LANG.ui.gameOver}</div>
      <button class="btn btn-primary" onclick="goToEnding()">${LANG.ui.seeResult}</button>
    </div>`;
  } else {
    // To night button
    const disabled = pendingChoices > 0 ? 'disabled' : '';
    html += `<button class="btn btn-primary" id="btn-to-night" ${disabled} onclick="goToNight()">${LANG.ui.toNight}</button>`;
  }

  screen.innerHTML = html;
  showScreen('screen-result');
}


/* ================================================================
   Render: Single Result Card
   ================================================================ */
function renderResultCard(r) {
  const tagMap = {
    good: { cls: 'tag-good', label: '良い' },
    bad: { cls: 'tag-bad', label: '悪い' },
    info: { cls: 'tag-info', label: '情報' },
    discovery: { cls: 'tag-discovery', label: '発見' },
    warm: { cls: 'tag-warm', label: '穏やか' },
  };
  const tagData = tagMap[r.tag] || tagMap.info;

  // Choose card id
  let cardId = '';
  if (r.eventId) cardId = `id="event-card-${r.eventId}"`;
  if (r.isPamphlet) cardId = `id="event-card-pamphlet"`;

  const extraClass = r.tag === 'discovery' ? ' discovery-card' : '';
  let html = `<div class="card result-card${extraClass}" ${cardId}>`;
  html += `<span class="result-tag ${tagData.cls}">${tagData.label}</span>`;
  html += `<div class="result-text">${nl2br(r.text)}</div>`;

  // Reason text (2nd time events)
  if (r.reason) {
    html += `<div class="reason-text">💡 なぜこうなるのか：<br>${nl2br(r.reason)}</div>`;
  }

  // Auto response (learned coping)
  if (r.autoResponse) {
    html += `<div class="action-bonus" style="margin-top:8px;font-size:0.88rem;">${r.autoResponse}</div>`;
  }

  // Event choices
  if (r.needsChoice) {
    const ev = LANG.events[r.eventId];
    html += `<div class="choice-row">
      <div class="card choice-card" onclick="handleEventChoice('${r.eventId}','A')">
        ${ev.choiceA.label}
      </div>
      <div class="card choice-card" onclick="handleEventChoice('${r.eventId}','B')">
        ${ev.choiceB.label}
      </div>
    </div>`;
  }

  // Pamphlet note choices
  if (r.isPamphlet) {
    html += `<div class="result-text" style="margin-top:10px;">${nl2br(r.notePrompt)}</div>`;
    html += `<div class="choice-row">
      <div class="card choice-card" onclick="handleNoteChoice('yes')">
        ${LANG.pamphlet.noteYes}
      </div>
      <div class="card choice-card" onclick="handleNoteChoice('no')">
        ${LANG.pamphlet.noteNo}
      </div>
    </div>`;
  }

  html += '</div>';
  return html;
}


/* ================================================================
   Step 5: Night Phase
   ================================================================ */
function goToNight() {
  const allocSleep = G._allocSleepPt || 0;
  let actualSleep = allocSleep;
  let nightResults = [];

  // --- Night event probability ---
  let nightEventProb = 0.40;
  if (G.motherMood === 'uneasy') nightEventProb += 0.20;
  if (G.medsSkippedYesterday) nightEventProb += 0.15;
  // Day 4-5 bump
  if (G.day >= 4) nightEventProb = Math.max(nightEventProb, 0.50);

  if (Math.random() < nightEventProb) {
    // Pick a night event
    const nightPool = buildNightEventPool();
    const ev = nightPool[Math.floor(Math.random() * nightPool.length)];

    let sleepLoss = ev.sleepLoss;
    let mpLoss = ev.mpLoss || 0;
    let text = ev.text;

    // Environment mitigation
    if (ev.type === 'toiletCall1' && G.nightLight) {
      sleepLoss = 0;
      text = LANG.nightEvents.toiletCall1NightLight;
    } else if (ev.type === 'toiletCall3' && G.nightLight) {
      sleepLoss = Math.max(sleepLoss - 1, 0);
      text = LANG.nightEvents.toiletCall3NightLight;
    } else if (ev.type === 'nightWander' && G.entranceSensor) {
      sleepLoss = 2;
      text += ' ' + LANG.nightEvents.nightWanderSensor;
    }

    actualSleep = Math.max(0, actualSleep - sleepLoss);
    G.mp = Math.max(0, G.mp - mpLoss);

    nightResults.push({ tag: 'bad', text: text });

    // Emotion log
    if (ev.type === 'nightWander') {
      G.emotionLog.push(LANG.nightEmotions.wanderNight);
    }
  }

  // Emotion log for very poor sleep
  if (actualSleep <= 2) {
    G.emotionLog.push(LANG.nightEmotions.sleepless);
  }

  // --- Sleep recovery table ---
  let hpRecovery = 0;
  let mpRecovery = 0;
  let sleepLabel = '';

  if (actualSleep >= 7) {
    hpRecovery = 3;
    mpRecovery = 1;
    sleepLabel = LANG.sleepResult.great;
  } else if (actualSleep >= 6) {
    hpRecovery = 2;
    sleepLabel = LANG.sleepResult.good;
  } else if (actualSleep >= 4) {
    hpRecovery = 1;
    sleepLabel = LANG.sleepResult.light;
  } else if (actualSleep >= 2) {
    hpRecovery = 0;
    sleepLabel = LANG.sleepResult.bad;
  } else {
    hpRecovery = -1;
    mpRecovery = -1;
    sleepLabel = LANG.sleepResult.severe;
  }

  G.hp = Math.max(0, Math.min(G.maxHp, G.hp + hpRecovery));
  G.mp = Math.max(0, Math.min(G.maxMp, G.mp + mpRecovery));

  // Disrupted sleep text
  if (actualSleep < allocSleep) {
    nightResults.push({
      tag: 'info',
      text: t(LANG.sleepResult.disrupted, { n: allocSleep, m: actualSleep }),
    });
  }

  // Recovery result
  const recovTag = hpRecovery > 0 ? 'good' : (hpRecovery < 0 ? 'bad' : 'info');
  let recovText = sleepLabel;
  if (hpRecovery !== 0) recovText += ` 体力${hpRecovery > 0 ? '+' : ''}${hpRecovery}`;
  if (mpRecovery !== 0) recovText += ` メンタル${mpRecovery > 0 ? '+' : ''}${mpRecovery}`;
  nightResults.push({ tag: recovTag, text: recovText });

  // --- Update prevSleep ---
  G.prevSleep = actualSleep;

  // --- Game over check ---
  checkGameOver();

  // --- Render night screen ---
  renderNight(allocSleep, actualSleep, nightResults);
}


/* ================================================================
   Build Night Event Pool
   ================================================================ */
function buildNightEventPool() {
  const pool = [
    { type: 'toiletCall1', text: LANG.nightEvents.toiletCall1, sleepLoss: 1, mpLoss: 0 },
    { type: 'toiletCall3', text: LANG.nightEvents.toiletCall3, sleepLoss: 3, mpLoss: 0 },
    { type: 'nightScream', text: LANG.nightEvents.nightScream, sleepLoss: 2, mpLoss: 1 },
  ];
  // Deep night wander available from Day 3+
  if (G.day >= 3) {
    pool.push({ type: 'nightWander', text: LANG.nightEvents.nightWander, sleepLoss: 4, mpLoss: 1 });
  }
  return pool;
}


/* ================================================================
   Render: Night Screen
   ================================================================ */
function renderNight(allocSleep, actualSleep, nightResults) {
  const screen = document.getElementById('screen-night');
  let html = '';

  // Header
  html += `<h2 class="night-header">🌙 ${LANG.ui.night}</h2>`;

  // Status bar
  html += renderStatus();

  // Allocated sleep display
  html += `<div class="morning-text" style="border-left-color:var(--blue);">
    <p>配分した睡眠時間：${allocSleep}時間</p>
    <p>実質睡眠時間：${actualSleep}時間</p>
  </div>`;

  // Night result cards
  html += '<div class="result-list">';
  for (const r of nightResults) {
    html += renderResultCard(r);
  }
  html += '</div>';

  // Game over or next day
  if (G.gameOver) {
    html += `<div class="gameover-overlay">
      <div class="gameover-text">${LANG.ui.gameOver}</div>
      <button class="btn btn-primary" onclick="goToEnding()">${LANG.ui.seeResult}</button>
    </div>`;
  } else if (G.day >= G.maxDays) {
    html += `<button class="btn btn-primary" onclick="goToEnding()">7日間の結果を見る</button>`;
  } else {
    html += `<button class="btn btn-primary" onclick="nextDay()">${LANG.ui.nextDay}</button>`;
  }

  screen.innerHTML = html;
  showScreen('screen-night');
}


/* ================================================================
   Next Day
   ================================================================ */
function nextDay() {
  G.day++;

  // Day difficulty scaling
  // Day 4-5: toilet cost +1 if motherHealth <= 1
  // Day 6-7: handled by existing probability increases in determineMotherMood

  renderMorning();
}


/* ================================================================
   Step 6: Ending & Review Report
   ================================================================ */
function goToEnding() {
  const screen = document.getElementById('screen-ending');
  let html = '';

  // --- Determine ending type ---
  let ending;
  if (G.gameOver) {
    ending = LANG.endings[G.gameOverReason]; // 'hp' or 'mp'
  } else if (G.usedService >= 2) {
    ending = LANG.endings.connected;
  } else if (G.usedService === 1) {
    ending = LANG.endings.firstStep;
  } else {
    ending = LANG.endings.alone;
  }

  // --- Title & message ---
  html += `<h2 class="ending-title">「${ending.title}」</h2>`;
  html += `<div class="ending-message">${nl2br(ending.message)}</div>`;

  // --- Conditional extra texts ---
  const extras = [];

  // Policy-based extras
  if (G.policy === 'solo') {
    if (G.gameOver) {
      extras.push(LANG.endingExtras.policySoloOver);
    } else {
      extras.push(LANG.endingExtras.policySoloClear);
    }
  }
  if (G.policy === 'work') {
    if (G.gameOver) {
      extras.push(LANG.endingExtras.policyWorkOver);
    } else {
      extras.push(LANG.endingExtras.policyWorkClear);
    }
  }

  // Peaceful moment
  if (G.hadPeacefulMoment) {
    extras.push(LANG.endingExtras.peaceful);
  }

  // Music / Album
  if (G.musicPlayed) extras.push(LANG.endingExtras.music);
  if (G.albumWatched) extras.push(LANG.endingExtras.album);

  // Discovery count
  if (G.discoveryCount >= 1) {
    extras.push(t(LANG.endingExtras.discovery, { n: G.discoveryCount }));
  }

  // Coping learned
  if (Object.keys(G.learnedCoping).length > 0) {
    extras.push(LANG.endingExtras.coping);
  }

  // Pamphlet
  if (G.receivedPamphlet) {
    extras.push(LANG.endingExtras.pamphlet);
  }
  if (G.madeBackupNote) {
    extras.push(LANG.endingExtras.backupNote);
  }

  // Service rejection experience
  if (G.serviceWasRejected) {
    extras.push(LANG.endingExtras.serviceRejected);
  }

  // Peer support
  if (G.foundPeerSupport) {
    extras.push(LANG.endingExtras.peerSupport);
  }

  for (const ex of extras) {
    html += `<div class="ending-extra">${nl2br(ex)}</div>`;
  }

  // --- Review report ---
  html += renderReviewReport();

  // --- Emotion log ---
  html += renderEmotionSection();

  // --- Social message ---
  html += renderSocialMessage();

  // --- Play again ---
  html += `<button class="btn btn-secondary" style="margin-top:24px;" onclick="playAgain()">${LANG.ui.playAgain}</button>`;
  html += `<div style="height:40px;"></div>`;

  screen.innerHTML = html;
  showScreen('screen-ending');
}


/* ================================================================
   Render: Review Report
   ================================================================ */
function renderReviewReport() {
  const rp = LANG.report;
  let html = '';

  // Title
  html += `<div class="report-section">
    <div class="report-title">━━━ ${rp.title7days} ━━━</div>`;

  // Policy
  if (G.policy) {
    const polName = LANG.ui.policy[G.policy]?.name || '';
    html += `<div class="report-row"><span>${rp.policyLabel}</span><span>「${polName}」</span></div>`;
  }
  html += '</div>';

  // --- Sacrificed ---
  html += `<div class="report-section">
    <div class="report-title">【${rp.sacrificed}】</div>`;

  const avgSleep = G.day > 0 ? (G.totalSleepPt / G.day).toFixed(1) : '0';
  html += `<div class="report-row"><span>${rp.avgSleep}</span><span>${t(rp.hoursPerDay, { n: avgSleep })}</span></div>`;
  html += `<div class="report-row"><span>${rp.skippedMeals}</span><span>${t(rp.timesUnit, { n: G.skippedMeals })}</span></div>`;
  html += `<div class="report-row"><span>${rp.restTime}</span><span>${t(rp.hoursUnit, { n: G.restDays * 2 })}</span></div>`;
  html += '</div>';

  // --- Protected ---
  html += `<div class="report-section">
    <div class="report-title">【${rp.protected}】</div>`;
  html += `<div class="report-row"><span>${rp.mealsServed}</span><span>${t(rp.mealsUnit, { n: G.mealsServed })}</span></div>`;
  html += `<div class="report-row"><span>${rp.peacefulTimes}</span><span>${t(rp.timesUnit, { n: G.peacefulCount })}</span></div>`;
  html += `<div class="report-row"><span>${rp.workedDays}</span><span>${t(rp.daysUnit, { n: G.workedDays })}</span></div>`;
  html += '</div>';

  // --- Discoveries ---
  if (G.discoveryCount >= 1) {
    html += `<div class="report-section">
      <div class="report-title">【${rp.discoveries}】</div>
      <ul class="discovery-list">`;
    const items = rp.discoveryItems;
    if (G.toiletMastered) html += `<li>${items.toiletMastered}</li>`;
    if (G.medsMastered) html += `<li>${items.medsMastered}</li>`;
    if (G.mealMastered) html += `<li>${items.mealMastered}</li>`;
    if (G.nightLight) html += `<li>${items.nightLight}</li>`;
    if (G.toiletSign) html += `<li>${items.toiletSign}</li>`;
    if (G.entranceSensor) html += `<li>${items.entranceSensor}</li>`;
    if (Object.keys(G.learnedCoping).length > 0) html += `<li>${items.learnedCoping}</li>`;
    if (G.foundPeerSupport) html += `<li>${items.foundPeerSupport}</li>`;
    if (G.madeBackupNote) html += `<li>${items.madeBackupNote}</li>`;
    if (G.musicPlayed) html += `<li>${items.musicPlayed}</li>`;
    if (G.albumWatched) html += `<li>${items.albumWatched}</li>`;
    html += '</ul></div>';
  }

  // --- Stats ---
  html += `<div class="report-section">
    <div class="report-title">【${rp.stats}】</div>`;
  html += `<div class="report-row"><span>${rp.serviceUsed}</span><span>${t(rp.timesUnit, { n: G.usedService })}</span></div>`;
  html += `<div class="report-row"><span>${rp.finalMoney}</span><span>${LANG.locale.currencyFormat(G.money)}</span></div>`;
  html += `<div class="report-row"><span>${rp.motherState}</span><span>${t(LANG.ui.careLevel, { n: G.motherCare })}（${LANG.healthLabel[G.motherHealth] || LANG.healthLabel[1]}）</span></div>`;
  html += `<div class="report-row"><span>${rp.yourHp}</span><span>${G.hp} / ${G.maxHp}</span></div>`;
  html += `<div class="report-row"><span>${rp.yourMp}</span><span>${G.mp} / ${G.maxMp}</span></div>`;
  html += '</div>';

  return html;
}


/* ================================================================
   Render: Emotion Section
   ================================================================ */
function renderEmotionSection() {
  if (G.emotionLog.length === 0) return '';

  const es = LANG.emotionSection;
  // Deduplicate
  const unique = [...new Set(G.emotionLog)];

  let html = `<div class="emotion-section">
    <div class="report-title">━━━ ${es.title} ━━━</div>
    <p style="font-size:0.88rem;margin-bottom:12px;">${es.intro}</p>`;

  for (const em of unique) {
    html += `<div class="emotion-item">${em}</div>`;
  }

  html += `<div class="emotion-affirm">${nl2br(es.affirm)}</div>`;
  html += '</div>';
  return html;
}


/* ================================================================
   Render: Social Message
   ================================================================ */
function renderSocialMessage() {
  const sm = LANG.locale.socialMessage;
  let html = '<div class="social-message">';
  html += `<p>${nl2br(sm.stats)}</p>`;
  html += `<p style="margin-top:12px;">${nl2br(sm.cta)}</p>`;
  html += '<div style="margin-top:12px;">';
  for (const r of sm.resources) {
    html += `<p>${r}</p>`;
  }
  html += '</div></div>';
  return html;
}


/* ================================================================
   Play Again
   ================================================================ */
function playAgain() {
  initGameState();
  selectedPolicy = '';
  renderTitle();
  showScreen('screen-title');
}


/* ================================================================
   Start Game
   ================================================================ */
function startGame() {
  initGameState();
  console.log('ゲーム開始', G);
  renderPolicy();
}


/* ================================================================
   Policy Selection Screen
   ================================================================ */
let selectedPolicy = '';

function renderPolicy() {
  const screen = document.getElementById('screen-policy');
  const p = LANG.ui.policy;
  const policies = ['solo', 'service', 'work'];

  let html = '';
  html += `<h2 class="day-header">${p.title}</h2>`;
  html += `<div class="morning-text"><p>${p.question}</p><p style="color:var(--red);font-size:0.85rem;">${p.locked}</p></div>`;

  html += '<div class="action-cards" style="margin-bottom:24px;">';
  for (const key of policies) {
    const pol = p[key];
    const isSelected = selectedPolicy === key;
    const selClass = isSelected ? ' selected' : '';
    html += `<div class="card action-card${selClass}" onclick="selectPolicy('${key}')">
      <div class="action-card-top">
        <span class="action-name">${pol.name}</span>
        <span class="action-cost">${pol.difficulty}</span>
      </div>
      <div class="action-detail" style="font-style:italic;margin-bottom:4px;">${pol.desc}</div>
      <div class="action-penalty">${pol.effect}</div>
    </div>`;
  }
  html += '</div>';

  const disabled = selectedPolicy ? '' : 'disabled';
  html += `<button class="btn btn-primary" id="btn-policy-confirm" ${disabled} onclick="confirmPolicy()">${p.confirm}</button>`;

  screen.innerHTML = html;
  showScreen('screen-policy');
}

function selectPolicy(key) {
  selectedPolicy = key;
  // Re-render without scrolling to top
  const screen = document.getElementById('screen-policy');
  const p = LANG.ui.policy;
  const policies = ['solo', 'service', 'work'];
  let html = '';
  html += `<h2 class="day-header">${p.title}</h2>`;
  html += `<div class="morning-text"><p>${p.question}</p><p style="color:var(--red);font-size:0.85rem;">${p.locked}</p></div>`;
  html += '<div class="action-cards" style="margin-bottom:24px;">';
  for (const k of policies) {
    const pol = p[k];
    const selClass = selectedPolicy === k ? ' selected' : '';
    html += `<div class="card action-card${selClass}" onclick="selectPolicy('${k}')">
      <div class="action-card-top">
        <span class="action-name">${pol.name}</span>
        <span class="action-cost">${pol.difficulty}</span>
      </div>
      <div class="action-detail" style="font-style:italic;margin-bottom:4px;">${pol.desc}</div>
      <div class="action-penalty">${pol.effect}</div>
    </div>`;
  }
  html += '</div>';
  html += `<button class="btn btn-primary" onclick="confirmPolicy()">${p.confirm}</button>`;
  screen.innerHTML = html;
}

function confirmPolicy() {
  if (!selectedPolicy) return;
  G.policy = selectedPolicy;
  selectedPolicy = '';
  renderMorning();
}


/* ================================================================
   Initialize
   ================================================================ */
document.addEventListener('DOMContentLoaded', () => {
  renderTitle();
  showScreen('screen-title');
});
</script>
